name: Intent Certification

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
      targets:
        description: Space/comma-separated certification targets
        required: true
        type: string
      digital_solutions_sha:
        description: Exact Digital Solutions SHA required by cross-repo self-update proof
        required: false
        type: string
      library_sha:
        description: Exact @bke/licensing SHA required by isolated TS-to-.NET lease proof
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: agent-intent-certification-${{ (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/certify ') && github.event.issue.number) || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve certification intent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/certify '))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      targets_json: ${{ steps.plan.outputs.targets_json }}
      digital_solutions_sha: ${{ steps.plan.outputs.digital_solutions_sha }}
      library_sha: ${{ steps.plan.outputs.library_sha }}
    steps:
      - id: plan
        name: Resolve exact head and targets
        uses: actions/github-script@v7
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          DISPATCH_DS_SHA: ${{ inputs.digital_solutions_sha }}
          DISPATCH_LIB_SHA: ${{ inputs.library_sha }}
        with:
          script: |
            const allowedTargets = [
              "contracts",
              "windows-x64",
              "installer",
              "rollback",
              "preflight",
              "utm-trust",
              "acquisition",
              "self-update",
              "fraction-lease",
              "startup-handshake",
            ];
            let sourceSha;
            let requested;
            let digitalSolutionsSha = "";
            let librarySha = "";
            let livePrHead = "";

            if (context.eventName === "issue_comment") {
              const association = context.payload.comment?.author_association ?? "NONE";
              const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
              if (!allowedAssociations.has(association)) {
                core.setFailed(`Certification command rejected for author association ${association}.`);
                return;
              }
              const issue = context.payload.issue;
              if (!issue?.pull_request) {
                core.setFailed("/certify is valid only on pull requests.");
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });
              sourceSha = response.data.head.sha;
              livePrHead = response.data.head.sha;
              requested = (context.payload.comment?.body ?? "")
                .replace(/^\/certify\s+/i, "")
                .trim();

              const rawTokens = requested.split(/[\s,]+/).map(v => v.trim()).filter(Boolean);
              const sourceToken = rawTokens.find(v => /^sha:[0-9a-f]{40}$/i.test(v));
              const dsToken = rawTokens.find(v => /^ds:[0-9a-f]{40}$/i.test(v));
              const libToken = rawTokens.find(v => /^lib:[0-9a-f]{40}$/i.test(v));
              if (sourceToken) sourceSha = sourceToken.slice(4);
              if (dsToken) digitalSolutionsSha = dsToken.slice(3);
              if (libToken) librarySha = libToken.slice(4);
              requested = rawTokens
                .filter(v => !/^sha:[0-9a-f]{40}$/i.test(v) && !/^ds:[0-9a-f]{40}$/i.test(v) && !/^lib:[0-9a-f]{40}$/i.test(v))
                .join(" ");
            } else {
              sourceSha = (process.env.DISPATCH_SHA ?? "").trim();
              requested = (process.env.DISPATCH_TARGETS ?? "").trim();
              digitalSolutionsSha = (process.env.DISPATCH_DS_SHA ?? "").trim();
              librarySha = (process.env.DISPATCH_LIB_SHA ?? "").trim();
            }

            if (!/^[0-9a-f]{40}$/i.test(sourceSha ?? "")) {
              core.setFailed("Certification requires an exact 40-character source SHA.");
              return;
            }

            const tokens = [...new Set(
              requested.toLowerCase().split(/[\s,]+/).map(v => v.trim()).filter(Boolean),
            )];
            const expanded = tokens.includes("full")
              ? ["contracts", "windows-x64", "installer", "rollback", "preflight"]
              : tokens;
            const unique = [...new Set(expanded)];
            const unknown = unique.filter(target => !allowedTargets.includes(target));
            if (unique.length === 0 || unknown.length > 0) {
              core.setFailed(
                `Allowed certification targets: ${allowedTargets.join(", ")} plus full. Requested: ${unique.join(", ") || "none"}.`,
              );
              return;
            }

            if (unique.includes("self-update") && !/^[0-9a-f]{40}$/i.test(digitalSolutionsSha)) {
              core.setFailed("self-update certification requires an exact Digital Solutions SHA via ds:<sha> or digital_solutions_sha.");
              return;
            }

            // Native → DS SQL → Agent proof consumes a fixed, already-certified
            // public upstream source, never an arbitrary moving DS branch.
            if (unique.includes("startup-handshake") &&
                digitalSolutionsSha !== "0be43d74d45b6a24307ddb626a6fd0d4b70bbba4") {
              core.setFailed("startup-handshake requires exact certified DS #366 main SHA.");
              return;
            }
            if (unique.includes("startup-handshake") && context.eventName === "issue_comment" &&
                sourceSha !== livePrHead) {
              core.setFailed("startup-handshake must certify the current exact PR head.");
              return;
            }
            if (unique.includes("fraction-lease") && !/^[0-9a-f]{40}$/i.test(librarySha)) {
              core.setFailed("fraction-lease requires an exact library SHA via lib:<sha> or library_sha.");
              return;
            }
            // PR comments execute from the trusted default-branch router.
            // Refuse any stale/overridden source SHA for this cross-repository proof.
            if (unique.includes("fraction-lease") && context.eventName === "issue_comment" &&
                sourceSha !== livePrHead) {
              core.setFailed("fraction-lease must certify the current exact PR head.");
              return;
            }

            core.setOutput("source_sha", sourceSha);
            core.setOutput("targets_json", JSON.stringify(unique));
            core.setOutput("digital_solutions_sha", digitalSolutionsSha);
            core.setOutput("library_sha", librarySha);
            await core.summary
              .addHeading("BKE Agent certification plan")
              .addRaw(`Exact source SHA: \`${sourceSha}\`\n\n`)
              .addRaw(`Targets: \`${unique.join(", ")}\`\n`)
              .addRaw(digitalSolutionsSha ? `Digital Solutions SHA: \`${digitalSolutionsSha}\`\n` : "")
              .addRaw(librarySha ? `Licensing library SHA: \`${librarySha}\`\n` : "")
              .write();

  contracts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'contracts')
    uses: ./.github/workflows/_intent-contracts.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  windows-x64:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'windows-x64')
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  installer:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'installer')
    uses: ./.github/workflows/dotnet-production-installer.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  rollback:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'rollback')
    uses: ./.github/workflows/dotnet-broken-update-rollback.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  preflight:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'preflight')
    uses: ./.github/workflows/dotnet-production-release-preflight.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  utm-trust:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'utm-trust')
    uses: ./.github/workflows/utm-disposable-target-trust.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  acquisition:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'acquisition')
    uses: ./.github/workflows/standalone-acquisition-certification.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  self-update:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'self-update')
    uses: ./.github/workflows/dotnet-signed-self-update.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      digital_solutions_sha: ${{ needs.plan.outputs.digital_solutions_sha }}


  fraction-lease:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'fraction-lease')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_SHA: ${{ needs.plan.outputs.source_sha }}
      LIBRARY_SHA: ${{ needs.plan.outputs.library_sha }}
    steps:
      - name: Checkout exact Agent consumer
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AGENT_SHA }}
          path: agent
          persist-credentials: false

      - name: Checkout exact public TypeScript contract producer
        uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-libraries-typescript
          ref: ${{ env.LIBRARY_SHA }}
          path: library
          persist-credentials: false

      - name: Verify both immutable source SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C agent rev-parse HEAD)" = "$AGENT_SHA"
          test "$(git -C library rev-parse HEAD)" = "$LIBRARY_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: library/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate actual TS signer output and immutable synthetic lease vectors
        shell: bash
        run: |
          set -euo pipefail
          cd library
          npm ci
          node @bke/licensing/tests/lease-vectors/generate.cjs > "$GITHUB_WORKSPACE/lease-vectors.json"
          sha256sum "$GITHUB_WORKSPACE/lease-vectors.json" | grep -Fx \
            "1e4fefe9df64dd2b0313a7b127c850417659a092647e515411a6595900802d80  $GITHUB_WORKSPACE/lease-vectors.json"
          npx --no-install tsx \
            "$GITHUB_WORKSPACE/agent/certification/lease-fraction/emit-actual-signer.mts" \
            "$GITHUB_WORKSPACE/lease-vectors.json" \
            "$GITHUB_WORKSPACE/library/@bke/licensing/providers/ed25519-account-product-lease.ts" \
            "$GITHUB_WORKSPACE/real-ts-producer.json"

      - name: Verify actual Ed25519 JWS with Agent .NET consumer
        working-directory: agent
        env:
          BKE_AGENT_SHA: ${{ env.AGENT_SHA }}
          BKE_LIBRARY_SHA: ${{ env.LIBRARY_SHA }}
        run: |
          dotnet run \
            --project dotnet/certification/BKE.LicensingAgent.LeaseFractionCertification/BKE.LicensingAgent.LeaseFractionCertification.csproj \
            --configuration Release -- \
            "$GITHUB_WORKSPACE/lease-vectors.json" \
            "$GITHUB_WORKSPACE/real-ts-producer.json" \
            "$GITHUB_WORKSPACE/fraction-proof.json"

      - name: Upload exact-SHA synthetic evidence (no private material)
        uses: actions/upload-artifact@v4
        with:
          name: lease-fraction-proof-${{ needs.plan.outputs.source_sha }}
          path: fraction-proof.json
          if-no-files-found: error
          retention-days: 14

  startup-handshake:
    name: Native Windows Agent → disposable DS SQL → .NET Agent signed policy
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'startup-handshake')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      AGENT_SHA: ${{ needs.plan.outputs.source_sha }}
      DS_SHA: ${{ needs.plan.outputs.digital_solutions_sha }}
      NODE_ENV: test
      DATABASE_URL: postgresql://bke:bke@127.0.0.1:5432/bke_test
      BKE_CROSS_REPO_STARTUP_SQL_PROOF: '1'
    steps:
      - name: Checkout exact Agent candidate code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AGENT_SHA }}
          path: agent
          persist-credentials: false

      - name: Checkout exact certified Digital Solutions source
        uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-digital-solutions
          ref: ${{ env.DS_SHA }}
          path: ds
          persist-credentials: false

      - name: Verify both exact source identities
        shell: pwsh
        run: |
          if ((git -C agent rev-parse HEAD).Trim() -ne $env:AGENT_SHA) { throw "Agent source SHA mismatch" }
          if ((git -C ds rev-parse HEAD).Trim() -ne $env:DS_SHA) { throw "DS source SHA mismatch" }
          if ($env:DS_SHA -ne "0be43d74d45b6a24307ddb626a6fd0d4b70bbba4") { throw "Uncertified DS producer" }
          if (!(Test-Path agent/certification/startup-handshake/DSAgentHandshake.test.ts)) { throw "Missing exact-head test" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ds/package-lock.json

      - name: Start disposable Windows PostgreSQL 17
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name postgresql-x64-17 -ErrorAction Stop
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $env:PGPASSWORD = 'root'
          $psql = Join-Path $env:PGBIN "psql.exe"
          if (!(Test-Path $psql)) { throw "PostgreSQL 17 client missing from Windows runner" }
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE bke LOGIN PASSWORD 'bke';"
          if ($LASTEXITCODE -ne 0) { throw "Disposable role creation failed" }
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE bke_test OWNER bke;"
          if ($LASTEXITCODE -ne 0) { throw "Disposable DB creation failed" }

      - name: Restore exact DS dependencies and apply SQL migrations
        shell: pwsh
        working-directory: ds
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "DS dependency restore failed" }
          npm run db:generate
          if ($LASTEXITCODE -ne 0) { throw "DS Prisma generation failed" }
          npm run db:deploy
          if ($LASTEXITCODE -ne 0) { throw "DS disposable PostgreSQL migration failed" }
          npm run db:status
          if ($LASTEXITCODE -ne 0) { throw "DS disposable schema is not current" }

      - name: Install exact Agent-owned integration test inside DS checkout
        shell: pwsh
        run: |
          Copy-Item agent/certification/startup-handshake/DSAgentHandshake.test.ts ds/tests/integration/agent-startup-handshake-crossrepo.test.ts
          $env:BKE_CROSS_REPO_STARTUP_INPUT = Join-Path $env:RUNNER_TEMP "startup-native-proof.json"
          $env:BKE_CROSS_REPO_STARTUP_OUTPUT = Join-Path $env:RUNNER_TEMP "startup-ds-signed-policy.json"
          "BKE_CROSS_REPO_STARTUP_INPUT=$env:BKE_CROSS_REPO_STARTUP_INPUT" >> $env:GITHUB_ENV
          "BKE_CROSS_REPO_STARTUP_OUTPUT=$env:BKE_CROSS_REPO_STARTUP_OUTPUT" >> $env:GITHUB_ENV

      - name: Produce actual protected Windows Agent installer attestation
        shell: pwsh
        working-directory: agent
        run: |
          dotnet run --project dotnet/certification/BKE.LicensingAgent.MachineKeyCertification/BKE.LicensingAgent.MachineKeyCertification.csproj --configuration Release -- --emit-startup-handshake "$env:BKE_CROSS_REPO_STARTUP_INPUT"
          if ($LASTEXITCODE -ne 0) { throw "Native Agent attestation issuer failed" }
          if (!(Test-Path $env:BKE_CROSS_REPO_STARTUP_INPUT)) { throw "No native proof was generated" }

      - name: Consume actual .NET bytes via DS two-admin SQL and signed policy
        shell: pwsh
        working-directory: ds
        run: |
          npx --no-install vitest run tests/integration/agent-startup-handshake-crossrepo.test.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { throw "DS exact-byte SQL issuer proof failed" }
          if (!(Test-Path $env:BKE_CROSS_REPO_STARTUP_OUTPUT)) { throw "DS did not issue signed policy" }

      - name: Feed exact DS signed bytes back into .NET Agent verifier
        shell: pwsh
        working-directory: agent
        run: |
          dotnet run --project dotnet/certification/BKE.LicensingAgent.MachineKeyCertification/BKE.LicensingAgent.MachineKeyCertification.csproj --configuration Release -- --verify-startup-handshake "$env:BKE_CROSS_REPO_STARTUP_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "Agent refused DS signed startup policy" }
          Write-Host "PASS: exact Agent .NET -> disposable DS PostgreSQL -> Agent .NET signed startup interoperability"

      - name: Clean disposable signed vectors (never publish private material)
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:BKE_CROSS_REPO_STARTUP_INPUT","$env:BKE_CROSS_REPO_STARTUP_OUTPUT" -Force -ErrorAction SilentlyContinue

  required-certification:
    name: Required certification
    if: always() && needs.plan.result == 'success'
    needs: [plan, contracts, windows-x64, installer, rollback, preflight, utm-trust, acquisition, self-update, fraction-lease, startup-handshake]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      TARGETS_JSON: ${{ needs.plan.outputs.targets_json }}
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
      WINDOWS_X64_RESULT: ${{ needs.windows-x64.result }}
      INSTALLER_RESULT: ${{ needs.installer.result }}
      ROLLBACK_RESULT: ${{ needs.rollback.result }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      UTM_TRUST_RESULT: ${{ needs.utm-trust.result }}
      ACQUISITION_RESULT: ${{ needs.acquisition.result }}
      SELF_UPDATE_RESULT: ${{ needs.self-update.result }}
      FRACTION_LEASE_RESULT: ${{ needs.fraction-lease.result }}
      STARTUP_HANDSHAKE_RESULT: ${{ needs.startup-handshake.result }}
    steps:
      - name: Verify declared certification plan
        shell: bash
        run: |
          node <<'NODE'
          const targets = JSON.parse(process.env.TARGETS_JSON);
          const results = {
            contracts: process.env.CONTRACTS_RESULT,
            "windows-x64": process.env.WINDOWS_X64_RESULT,
            installer: process.env.INSTALLER_RESULT,
            rollback: process.env.ROLLBACK_RESULT,
            preflight: process.env.PREFLIGHT_RESULT,
            "utm-trust": process.env.UTM_TRUST_RESULT,
            acquisition: process.env.ACQUISITION_RESULT,
            "self-update": process.env.SELF_UPDATE_RESULT,
            "fraction-lease": process.env.FRACTION_LEASE_RESULT,
            "startup-handshake": process.env.STARTUP_HANDSHAKE_RESULT,
          };
          const failed = targets
            .filter(target => results[target] !== "success")
            .map(target => `${target}=${results[target] ?? "missing"}`);
          if (failed.length > 0) {
            console.error(
              `Required certification failed for ${process.env.SOURCE_SHA}: ${failed.join(", ")}`,
            );
            process.exit(1);
          }
          console.log(
            `Required certification PASS for ${process.env.SOURCE_SHA}: ${targets.join(", ")}`,
          );
          NODE
