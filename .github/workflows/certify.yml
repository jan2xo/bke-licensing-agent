name: Intent Certification

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
      targets:
        description: Space/comma-separated certification targets
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: agent-intent-certification-${{ (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/certify ') && github.event.issue.number) || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve certification intent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/certify '))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      targets_json: ${{ steps.plan.outputs.targets_json }}
    steps:
      - id: plan
        name: Resolve exact head and targets
        uses: actions/github-script@v7
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
        with:
          script: |
            const allowedTargets = ["contracts"];
            let sourceSha;
            let requested;

            if (context.eventName === "issue_comment") {
              const association = context.payload.comment?.author_association ?? "NONE";
              const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
              if (!allowedAssociations.has(association)) {
                core.setFailed(`Certification command rejected for author association ${association}.`);
                return;
              }
              const issue = context.payload.issue;
              if (!issue?.pull_request) {
                core.setFailed("/certify is valid only on pull requests.");
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });
              sourceSha = response.data.head.sha;
              requested = (context.payload.comment?.body ?? "")
                .replace(/^\/certify\s+/i, "")
                .trim();
            } else {
              sourceSha = (process.env.DISPATCH_SHA ?? "").trim();
              requested = (process.env.DISPATCH_TARGETS ?? "").trim();
            }

            if (!/^[0-9a-f]{40}$/i.test(sourceSha ?? "")) {
              core.setFailed("Certification requires an exact 40-character source SHA.");
              return;
            }

            const tokens = [...new Set(
              requested.toLowerCase().split(/[\s,]+/).map(v => v.trim()).filter(Boolean),
            )];
            const unknown = tokens.filter(target => !allowedTargets.includes(target));
            if (tokens.length === 0 || unknown.length > 0) {
              core.setFailed(
                `Allowed certification target: contracts. Requested: ${tokens.join(", ") || "none"}.`,
              );
              return;
            }

            core.setOutput("source_sha", sourceSha);
            core.setOutput("targets_json", JSON.stringify(tokens));
            await core.summary
              .addHeading("BKE Agent certification plan")
              .addRaw(`Exact source SHA: \`${sourceSha}\`\n\n`)
              .addRaw(`Targets: \`${tokens.join(", ")}\`\n`)
              .write();

  contracts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets_json), 'contracts')
    uses: ./.github/workflows/_intent-contracts.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  required-certification:
    name: Required certification
    if: always() && needs.plan.result == 'success'
    needs: [plan, contracts]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      TARGETS_JSON: ${{ needs.plan.outputs.targets_json }}
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
    steps:
      - name: Verify declared certification plan
        shell: bash
        run: |
          node <<'NODE'
          const targets = JSON.parse(process.env.TARGETS_JSON);
          const results = { contracts: process.env.CONTRACTS_RESULT };
          const failed = targets
            .filter(target => results[target] !== "success")
            .map(target => `${target}=${results[target] ?? "missing"}`);
          if (failed.length > 0) {
            console.error(
              `Required certification failed for ${process.env.SOURCE_SHA}: ${failed.join(", ")}`,
            );
            process.exit(1);
          }
          console.log(
            `Required certification PASS for ${process.env.SOURCE_SHA}: ${targets.join(", ")}`,
          );
          NODE
