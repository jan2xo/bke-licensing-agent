name: Native packaging

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "packaging/**"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install build dependencies
        run: python -m pip install pyinstaller build && python -m pip install -e .
      - name: Freeze native Linux executables
        run: |
          pyinstaller --clean --noconfirm bke-licensing-agent.spec
          mv dist/bke-licensing-agent dist-agent
          pyinstaller --clean --noconfirm bke-license-center.spec
          mkdir -p dist/linux
          mv dist-agent dist/linux/bke-licensing-agent
          mv dist/bke-license-center dist/linux/bke-license-center
      - name: Smoke test frozen Linux Agent
        run: dist/linux/bke-licensing-agent/bke-licensing-agent --help
      - name: Smoke test frozen Linux License Center
        run: dist/linux/bke-license-center/bke-license-center --smoke
      - name: Build Debian package
        run: packaging/linux/build-deb.sh
      - name: Generate Linux release evidence
        env:
          PYTHON: python
        run: python scripts/release_evidence.py platform linux-x64 dist/installer/bke-licensing-agent_1.0.0_amd64.deb dist/release-evidence/linux-x64
      - name: Attest Linux package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/installer/bke-licensing-agent_1.0.0_amd64.deb
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-1.0.0-Linux-x64
          path: dist/installer/bke-licensing-agent_1.0.0_amd64.deb
      - name: Upload Linux release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-linux-x64
          path: dist/release-evidence/linux-x64

  windows:
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install pyinstaller pywin32 && python -m pip install -e .
      - name: Freeze Windows executables
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm bke-license-center.spec
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Move-Item dist/bke-license-center dist/windows/bke-license-center
          pyinstaller --clean --noconfirm --name bke-licensing-agent-service packaging/windows/service_entry.py
          Move-Item dist/bke-licensing-agent-service dist/windows/bke-licensing-agent-service-wrapper
      - name: Smoke test frozen Windows Agent service wrapper
        shell: pwsh
        run: dist/windows/bke-licensing-agent-service-wrapper/bke-licensing-agent-service.exe --help
      - name: Smoke test frozen Windows License Center
        shell: pwsh
        run: dist/windows/bke-license-center/bke-license-center.exe --smoke
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent.iss
      - name: Generate Windows release evidence
        shell: pwsh
        run: python scripts/release_evidence.py platform windows-x64 dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe dist/release-evidence/windows-x64
      - name: Attest Windows installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-1.0.0-Windows-x64
          path: dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe
      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-windows-x64
          path: dist/release-evidence/windows-x64

  macos:
    runs-on: macos-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install build dependencies
        run: python -m pip install pyinstaller && python -m pip install -e .
      - name: Freeze native macOS executables
        run: |
          pyinstaller --clean --noconfirm bke-licensing-agent.spec
          mv dist/bke-licensing-agent dist-agent
          pyinstaller --clean --noconfirm bke-license-center.spec
          mkdir -p dist
          mv dist-agent dist/bke-licensing-agent
      - name: Smoke test frozen macOS Agent
        run: dist/bke-licensing-agent/bke-licensing-agent --help
      - name: Smoke test frozen macOS License Center
        run: dist/bke-license-center/bke-license-center --smoke
      - name: Build macOS package
        run: packaging/macos/build-pkg.sh 1.0.0
      - name: Generate macOS release evidence
        env:
          PYTHON: python
        run: python scripts/release_evidence.py platform macos-arm64 dist/installer/BKE-Licensing-Agent-1.0.0.pkg dist/release-evidence/macos-arm64
      - name: Attest macOS package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/installer/BKE-Licensing-Agent-1.0.0.pkg
      - name: Upload macOS release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-1.0.0-macOS
          path: dist/installer/BKE-Licensing-Agent-1.0.0.pkg
      - name: Upload macOS release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-macos-arm64
          path: dist/release-evidence/macos-arm64

  release-evidence:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install evidence validators
        run: python -m pip install jsonschema
      - uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          path: dist/release-evidence
      - name: Aggregate and validate release evidence
        run: |
          python scripts/release_evidence.py aggregate dist/release-evidence dist/release-envelope "$SOURCE_SHA"
          python - <<'PY'
          import json
          from jsonschema import validate
          from pathlib import Path
          schema=json.loads(Path('release/release-manifest.schema.json').read_text())
          manifest=json.loads(Path('dist/release-envelope/release-manifest.json').read_text())
          validate(manifest, schema)
          expected={item['sha256'] for item in manifest['artifacts']}
          actual={line.split()[0] for line in Path('dist/release-envelope/SHA256SUMS.txt').read_text().splitlines()}
          assert expected == actual
          assert manifest['source']['commit'] == __import__('os').environ['SOURCE_SHA']
          print('release evidence: valid')
          PY
      - name: Upload aggregate release evidence
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-1.0.0-release-evidence
          path: dist/release-envelope
