      - name: Assemble UTM certification bundle
        shell: pwsh
        run: |
          $package = 'dist/utm-certification-package'
          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $package | Out-Null

          $installer = "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe"
