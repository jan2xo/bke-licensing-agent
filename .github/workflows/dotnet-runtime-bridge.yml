          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw ("expected ARM64 PE 0xAA64 but got 0x{0:X4}" -f $machine) }
          Write-Host 'Native ARM64 certification seeder PE: PASS'

