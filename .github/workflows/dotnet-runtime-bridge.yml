          $product = Join-Path $env:AIR_PRODUCT_ROOT 'BKE AirStack.dll'
          dotnet $harness $product 'BKE_Air_Stack.Licensing.AgentClient' 'AuthorizeAsync' 'Allowed'
          if ($LASTEXITCODE -ne 0) { throw 'Air Stack actual AgentClient did not authorize through installed Gen2' }
          Write-Host 'Air Stack actual AgentClient -> installed Gen2 authorization: PASS'

      - name: Prove exact Render Dock client authorizes through installed Gen2
        shell: pwsh
        run: |
