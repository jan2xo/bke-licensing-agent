          if ($LASTEXITCODE -ne 0) { throw 'ARM64 Gen2 runtime publish failed' }

      - name: Verify ARM64 PE machine type
        shell: pwsh
        run: |
          function Assert-Arm64Pe([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $Path))
            if ($bytes.Length -lt 256) { throw "PE file too small: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw "invalid PE signature: $Path" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) { throw ("expected ARM64 PE 0xAA64 but got 0x{0:X4}: {1}" -f $machine,$Path) }
            Write-Host ("ARM64 PE verified 0xAA64: {0}" -f $Path)
          }
          Assert-Arm64Pe 'dist/windows/bke-licensing-agent-service-arm64/bke-licensing-agent-service.exe'
          Assert-Arm64Pe 'dist/windows/bke-licensing-agent-runtime-arm64/bke-licensing-agent-runtime.exe'

      - name: Build ARM64 certification-only bridge installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent-runtime-bridge-arm64.iss
          $installer = "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-arm64.exe"
          if (!(Test-Path $installer)) { throw "ARM64 bridge installer missing: $installer" }

      - name: Assemble ARM64 UTM certification bundle
        shell: pwsh
        run: |
          $package = 'dist/utm-arm64-certification-package'
          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $package | Out-Null
          $installer = "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-arm64.exe"
          Copy-Item $installer $package
          Copy-Item 'certification/windows_runtime_bridge_reboot.ps1' $package
          @"
          BKE Licensing Agent Gen2 Runtime Bridge - Windows ARM64
          CERTIFICATION ONLY - NOT A PRODUCTION RELEASE

          Source commit:
          ${{ github.sha }}

          Native ARM64 service/runtime PE headers were verified as 0xAA64.
          Functional x64 bridge gates passed earlier in this job.
          Actual ARM64 execution/reboot certification must be completed on the persistent UTM Windows 11 ARM64 VM.

          DO NOT use this installer for production cutover.
          "@ | Set-Content -LiteralPath (Join-Path $package 'CERTIFICATION-ONLY.txt') -Encoding utf8

          $sum = Join-Path $package 'SHA256SUMS.txt'
          Get-ChildItem -LiteralPath $package -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath $sum -Encoding ascii
          }
          $zip = "dist/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-arm64-Certification-${{ github.sha }}.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Format-List

      - name: Upload ARM64 UTM certification bundle
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-RuntimeBridge-Certification-Windows-arm64
          path: dist/BKE-Licensing-Agent-2.0.0-RuntimeBridge-Windows-arm64-Certification-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build and self-test disposable reboot certification seeder
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP 'runtime-bridge-seeder-selftest'
          Remove-Item $dataRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataRoot | Out-Null

          $env:PYTHONPATH = (Resolve-Path 'src').Path
          @'
          import os
          from pathlib import Path
          from bke_licensing_agent.storage.database import Database, CURRENT_SCHEMA_VERSION

          root = Path(os.environ['SEEDER_SELFTEST_DATA'])
          db = Database(root / 'agent.db')
          version = db.connection.execute('SELECT version FROM schema_version LIMIT 1').fetchone()[0]
          db.close()
          if version != CURRENT_SCHEMA_VERSION:
              raise SystemExit(f'schema mismatch: {version} != {CURRENT_SCHEMA_VERSION}')
          print(f'Fresh Agent schema ready: v{version}')
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'init-seeder-db.py') -Encoding utf8
          $env:SEEDER_SELFTEST_DATA = $dataRoot
          python (Join-Path $env:RUNNER_TEMP 'init-seeder-db.py')
          if ($LASTEXITCODE -ne 0) { throw 'isolated Agent schema initialization failed' }

          dotnet publish dotnet/certification/BKE.LicensingAgent.RuntimeBridgeSeeder/BKE.LicensingAgent.RuntimeBridgeSeeder.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --verbosity minimal `
            --output dist/reboot-seeder-x64
          if ($LASTEXITCODE -ne 0) { throw 'x64 certification seeder publish failed' }

          & dist/reboot-seeder-x64/bke-runtime-bridge-cert-seeder.exe --data-root $dataRoot
          if ($LASTEXITCODE -ne 0) { throw "certification seeder self-test failed: $LASTEXITCODE" }

          $isolated = 'dist/reboot-seeder-x64-isolated'
          Remove-Item $isolated -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $isolated | Out-Null
          Copy-Item 'dist/reboot-seeder-x64/bke-runtime-bridge-cert-seeder.exe' $isolated
          & (Join-Path $isolated 'bke-runtime-bridge-cert-seeder.exe') --data-root $dataRoot
          if ($LASTEXITCODE -ne 0) { throw "isolated single-file certification seeder failed: $LASTEXITCODE" }
          Write-Host 'Isolated single-file certification seeder: PASS'

          @'
          import os
          import sqlite3
          from pathlib import Path

          root = Path(os.environ['SEEDER_SELFTEST_DATA'])
          db = sqlite3.connect(root / 'agent.db')
          try:
              product = db.execute(
                  'SELECT product_id, version FROM discovered_products WHERE product_id=?',
                  ('runtime-bridge-cert',),
              ).fetchone()
              license_row = db.execute(
                  'SELECT product_id, product_version, installation_id, signed_payload, signed_signature, signed_algorithm '
                  'FROM verified_licenses WHERE lease_id=?',
                  ('runtime-bridge-lease',),
              ).fetchone()
              binding = db.execute(
                  'SELECT product_id, installation_id, active_lease_id FROM active_license_bindings WHERE product_id=?',
                  ('runtime-bridge-cert',),
              ).fetchone()
          finally:
              db.close()

          if product != ('runtime-bridge-cert', '2.0.0'):
              raise SystemExit(f'bad product fixture: {product}')
          if not license_row or license_row[0:3] != ('runtime-bridge-cert', '2.0.0', 'runtime-bridge-installation'):
              raise SystemExit(f'bad license fixture: {license_row}')
          if not all(license_row[3:]) or license_row[-1] != 'Ed25519':
              raise SystemExit('signed authority fields missing')
          if binding != ('runtime-bridge-cert', 'runtime-bridge-installation', 'runtime-bridge-lease'):
              raise SystemExit(f'bad binding fixture: {binding}')
          if not (root / 'trusted-keys' / 'runtime-bridge-state-key.pem').is_file():
              raise SystemExit('trusted certification key missing')
          print('Signed certification seeder database fixture: PASS')
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'verify-seeder-db.py') -Encoding utf8
          python (Join-Path $env:RUNNER_TEMP 'verify-seeder-db.py')
          if ($LASTEXITCODE -ne 0) { throw 'certification seeder database verification failed' }

      - name: Prove disposable seeder authorizes through installed Gen2
        shell: pwsh
        run: |
          $liveDataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'
          Stop-Service -Name $env:SERVICE_NAME -Force
          (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
          try {
            & dist/reboot-seeder-x64/bke-runtime-bridge-cert-seeder.exe --data-root $liveDataRoot
            if ($LASTEXITCODE -ne 0) { throw "live certification seeder failed: $LASTEXITCODE" }
          }
          finally {
            Start-Service -Name $env:SERVICE_NAME
            (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          }

          $body = @{
            product_id = 'runtime-bridge-cert'
            version = '2.0.0'
            installation_id = 'runtime-bridge-installation'
          } | ConvertTo-Json -Compress

          $deadline = (Get-Date).AddSeconds(60)
          do {
            try {
              $response = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:43873/v1/authorize' -ContentType 'application/json' -Body $body -TimeoutSec 3
              if ($response.authorized -eq $true -and $response.reason -eq 'authorized') {
                Write-Host 'Disposable certification seeder -> installed Gen2 authorization: PASS'
                exit 0
              }
              Write-Host "Seeder authorization not ready: $($response | ConvertTo-Json -Compress)"
            } catch {}
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)

          throw 'Disposable certification seeder did not authorize through installed Gen2'

      - name: Publish native ARM64 reboot certification seeder
        shell: pwsh
        run: |
          dotnet publish dotnet/certification/BKE.LicensingAgent.RuntimeBridgeSeeder/BKE.LicensingAgent.RuntimeBridgeSeeder.csproj `
