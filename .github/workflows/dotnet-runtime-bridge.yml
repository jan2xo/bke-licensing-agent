name: .NET Agent runtime bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feat/agent-runtime-bridge
    paths:
      - "dotnet/**"
      - "packaging/windows/bke-licensing-agent-runtime-bridge.iss"
      - "packaging/windows/bke-licensing-agent-runtime-bridge-arm64.iss"
      - "certification/windows_runtime_bridge_seed.ps1"
      - "certification/windows_runtime_bridge_reboot.ps1"
      - ".github/workflows/dotnet-runtime-bridge.yml"
      - "docs/agent-runtime-replacement-contract.md"
  pull_request:
    branches:
      - refactor/dotnet10-agent-gen2
    paths:
      - "dotnet/**"
      - "packaging/windows/bke-licensing-agent-runtime-bridge.iss"
      - "packaging/windows/bke-licensing-agent-runtime-bridge-arm64.iss"
      - "certification/windows_runtime_bridge_seed.ps1"
      - "certification/windows_runtime_bridge_reboot.ps1"
      - ".github/workflows/dotnet-runtime-bridge.yml"
      - "docs/agent-runtime-replacement-contract.md"

permissions:
  contents: read

jobs:
  windows-python-to-dotnet:
    name: Windows legacy Python -> .NET bridge
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      LEGACY_VERSION: "1.0.0"
      BRIDGE_VERSION: "2.0.0"
      SERVICE_NAME: "BKE-Licensing-Agent"
      AIR_STACK_SHA: "1fd4756a99ebc253a0f402c3bd99da9a960729ce"
      RENDER_DOCK_SHA: "fb4a68aa6b1068924834c430652f66fc6d3b1984"

    steps:
      - uses: actions/checkout@v4

      - name: Check out exact Air Stack candidate
        uses: actions/checkout@v4
        with:
          repository: jan2xo/BKE_AIR_STACK
          ref: ${{ env.AIR_STACK_SHA }}
          path: products/air-stack

      - name: Check out exact Render Dock candidate
        uses: actions/checkout@v4
        with:
          repository: jan2xo/BKE_RENDER_DOCK
          ref: ${{ env.RENDER_DOCK_SHA }}
          path: products/render-dock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install legacy build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[test]"
          choco install innosetup -y --no-progress

      - name: Build legacy Python Windows payload
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist/windows | Out-Null

          pyinstaller --clean --noconfirm --hidden-import win32timezone --name bke-licensing-agent-service packaging/windows/service_entry.py
          Move-Item dist/bke-licensing-agent-service dist/windows/bke-licensing-agent-service

          pyinstaller --clean --noconfirm bke-license-center.spec
          Move-Item dist/bke-license-center dist/windows/bke-license-center

          pyinstaller --clean --noconfirm --onefile --name bke-updater-core packaging/windows/updater_core_entry.py
          New-Item -ItemType Directory -Force dist/windows/bke-updater-core | Out-Null
          Move-Item dist/bke-updater-core.exe dist/windows/bke-updater-core/bke-updater-core.exe

          pyinstaller --clean --noconfirm --onefile --name bke-privileged-provisioner packaging/windows/provision_privileged_runtime.py
          New-Item -ItemType Directory -Force dist/windows/bke-privileged-provisioner | Out-Null
          Move-Item dist/bke-privileged-provisioner.exe dist/windows/bke-privileged-provisioner/bke-privileged-provisioner.exe

      - name: Generate disposable bridge trust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/privileged-payload/target-keys | Out-Null
          New-Item -ItemType Directory -Force dist/windows/privileged-payload/target-policies | Out-Null
          @'
          import base64, json
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          root = Path('dist/windows/privileged-payload')
          private = Ed25519PrivateKey.generate()
          public = private.public_key()
          key_id = 'runtime-bridge-cert-v1'
          (root / 'target-keys' / f'{key_id}.pem').write_bytes(public.public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          unsigned = {
              'schema': 'bke.install-target-policy.v1',
              'policy_id': 'runtime-bridge-cert-only',
              'revision': 1,
              'product_id': 'bke-certification-product',
              'platform': 'windows',
              'architecture': 'x86_64',
              'install_root': r'C:\\Program Files\\BKE Digital Solutions\\Certification Product',
              'entry_point': 'product.exe',
              'signing_key_id': key_id,
              'algorithm': 'Ed25519',
          }
          canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          document = dict(unsigned)
          document['signature'] = base64.b64encode(private.sign(canonical)).decode('ascii')
          (root / 'target-policies' / 'runtime-bridge-cert-only.json').write_text(
              json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('Disposable runtime-bridge trust generated; it is not production authority.')
          '@ | python -

      - name: Build canonical legacy installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent.iss
          $installer = "dist/installer/BKE-Licensing-Agent-${env:LEGACY_VERSION}-Windows-x64.exe"
          if (!(Test-Path $installer)) { throw "legacy installer missing: $installer" }

      - name: Install and freeze legacy machine state
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/installer/BKE-Licensing-Agent-${env:LEGACY_VERSION}-Windows-x64.exe").Path
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=legacy-install.log' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content legacy-install.log -ErrorAction SilentlyContinue; throw "legacy installer failed: $($process.ExitCode)" }

          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction Stop
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $record = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($record.PathName -notmatch 'service\\bke-licensing-agent-service\.exe') { throw "legacy SCM path drifted: $($record.PathName)" }

          $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'
          New-Item -ItemType Directory -Force $dataRoot | Out-Null
          'python-to-dotnet-runtime-bridge' | Set-Content -Encoding UTF8 (Join-Path $dataRoot 'bridge-durable-marker.txt')

          # The legacy self-update thread waits five seconds before its first network check.
          # Stop it immediately after proving the installed service is healthy so CI never
          # contacts production update authority during migration certification.
          Stop-Service -Name $env:SERVICE_NAME -Force
          (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))

      - name: Seed and freeze real legacy licensing state
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'
          $snapshot = Join-Path $env:RUNNER_TEMP 'runtime-bridge-authority-state.json'
          python dotnet/certification/runtime_bridge_state_fixture.py seed --data-root "$dataRoot" --snapshot "$snapshot"
          if (!(Test-Path $snapshot)) { throw 'durable authority snapshot was not created' }

      - name: Prepare .NET runtime bridge publish directories
        shell: pwsh
        run: |
          Remove-Item dist/windows/bke-licensing-agent-service -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist/windows/bke-licensing-agent-runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist/windows/bke-licensing-agent-service | Out-Null
          New-Item -ItemType Directory -Force dist/windows/bke-licensing-agent-runtime | Out-Null

      - name: Publish stable .NET bootstrap
        shell: pwsh
        run: |
          dotnet publish dotnet/src/BKE.LicensingAgent.Bootstrap/BKE.LicensingAgent.Bootstrap.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${env:BRIDGE_VERSION} `
            --verbosity minimal `
            --output dist/windows/bke-licensing-agent-service

          if (!(Test-Path 'dist/windows/bke-licensing-agent-service/bke-licensing-agent-service.exe')) {
            Get-ChildItem dist/windows/bke-licensing-agent-service -Recurse -Force | Format-Table FullName
            throw 'stable bootstrap service executable missing'
          }

      - name: Publish replaceable Gen2 runtime
        shell: pwsh
        run: |
          dotnet publish dotnet/src/BKE.LicensingAgent.Host/BKE.LicensingAgent.Host.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:BKEAgentRuntimeBridge=true -p:Version=${env:BRIDGE_VERSION} `
            --verbosity minimal `
            --output dist/windows/bke-licensing-agent-runtime

          if (!(Test-Path 'dist/windows/bke-licensing-agent-runtime/bke-licensing-agent-runtime.exe')) {
            Get-ChildItem dist/windows/bke-licensing-agent-runtime -Recurse -Force | Format-Table FullName
            throw 'replaceable Gen2 runtime executable missing'
          }

      - name: Build runtime-neutral migration installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent-runtime-bridge.iss
          $installer = "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe"
          if (!(Test-Path $installer)) { throw "bridge installer missing: $installer" }

      - name: Migrate installed Python service to .NET runtime bridge
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe").Path
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=bridge-install.log' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content bridge-install.log -ErrorAction SilentlyContinue; throw "bridge installer failed: $($process.ExitCode)" }

          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction Stop
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))

          $record = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($record.PathName -notmatch 'service\\bke-licensing-agent-service\.exe') {
            throw "stable SCM entry point changed: $($record.PathName)"
          }

          $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'
          $marker = Join-Path $dataRoot 'bridge-durable-marker.txt'
          if (!(Test-Path $marker)) { throw 'durable ProgramData marker was lost during language migration' }
          if ((Get-Content $marker -Raw).Trim() -ne 'python-to-dotnet-runtime-bridge') { throw 'durable marker changed' }

          $oldPythonArtifacts = Get-ChildItem 'C:\Program Files\BKE Digital Solutions\Licensing Agent\service','C:\Program Files\BKE Digital Solutions\Licensing Agent\runtime' -Recurse -File |
            Where-Object { $_.Name -match '^python\d*\.dll$|^base_library\.zip$|^python\d+\._pth$' }
          if ($oldPythonArtifacts) { $oldPythonArtifacts | Format-Table FullName; throw 'Python runtime artifacts remain in service/runtime payload' }

      - name: Prove durable state and product authorization after migration
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'
          $snapshot = Join-Path $env:RUNNER_TEMP 'runtime-bridge-authority-state.json'
          python dotnet/certification/runtime_bridge_state_fixture.py assert --data-root "$dataRoot" --snapshot "$snapshot"

          $uri = 'http://127.0.0.1:43873/v1/authorize'
          $body = @{
            product_id = 'runtime-bridge-cert'
            version = '2.0.0'
            installation_id = 'runtime-bridge-installation'
          } | ConvertTo-Json -Compress
          $deadline = (Get-Date).AddSeconds(60)
          $authorized = $false
          do {
            try {
              $response = Invoke-RestMethod -Method Post -Uri $uri -ContentType 'application/json' -Body $body -TimeoutSec 2
              if ($response.authorized -eq $true -and $response.reason -eq 'authorized') {
                $authorized = $true
                break
              }
              Write-Host "Gen2 authorization not ready: $($response | ConvertTo-Json -Compress)"
            } catch {}
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (!$authorized) {
            throw 'preserved Python licensing/trust state did not authorize through migrated Gen2 runtime'
          }
          Write-Host 'Preserved Python state -> Gen2 product authorization: PASS'

      - name: Prove Gen2 local API behind stable service
        shell: pwsh
        run: |
          $uri = 'http://127.0.0.1:43873/license-center?product_id=runtime-bridge-cert&version=2.0.0&installation_id=github-actions'
          $deadline = (Get-Date).AddSeconds(60)
          $healthy = $false
          do {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $uri -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (!$healthy) {
            $installRoot = 'C:\\Program Files\\BKE Digital Solutions\\Licensing Agent'
            $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\\Licensing Agent'
            $runtimeExe = Join-Path $installRoot 'runtime\\bke-licensing-agent-runtime.exe'

            Write-Host '=== service ==='
            Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'" | Format-List *

            Write-Host '=== Agent processes ==='
            Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -like '*BKE Digital Solutions*Licensing Agent*' } |
              Format-Table ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine -Wrap

            Write-Host '=== installed payload ==='
            Get-ChildItem $installRoot -Recurse -Force |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize

            Write-Host '=== port 43873 ==='
            Get-NetTCPConnection -LocalPort 43873 -ErrorAction SilentlyContinue |
              Format-Table LocalAddress,LocalPort,State,OwningProcess -AutoSize

            Write-Host '=== recent Application events ==='
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'BKE|\.NET Runtime|Application Error' -or $_.Message -match 'BKE Licensing Agent|bke-licensing-agent-runtime' } |
              Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message |
              Format-List

            if (Test-Path $runtimeExe) {
              Write-Host '=== direct Gen2 runtime probe ==='
              Stop-Service -Name $env:SERVICE_NAME -Force -ErrorAction SilentlyContinue
              (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))

              $stdout = Join-Path $env:RUNNER_TEMP 'gen2-runtime.stdout.log'
              $stderr = Join-Path $env:RUNNER_TEMP 'gen2-runtime.stderr.log'
              Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

              $savedVnext = $env:BKE_AGENT_VNEXT_ENABLE
              $savedDataRoot = $env:BKE_AGENT_DATA_DIR
              try {
                $env:BKE_AGENT_VNEXT_ENABLE = '1'
                $env:BKE_AGENT_DATA_DIR = $dataRoot
                $probe = Start-Process $runtimeExe -WorkingDirectory (Split-Path $runtimeExe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
                Start-Sleep -Seconds 5
                if (!$probe.HasExited) {
                  Write-Host "Direct runtime stayed alive for 5s (pid=$($probe.Id)); stopping diagnostic probe."
                  Stop-Process -Id $probe.Id -Force
                  $probe.WaitForExit()
                } else {
                  Write-Host "Direct runtime exited with code $($probe.ExitCode)."
                }
              } finally {
                $env:BKE_AGENT_VNEXT_ENABLE = $savedVnext
                $env:BKE_AGENT_DATA_DIR = $savedDataRoot
              }

              Write-Host '--- direct runtime stdout ---'
              Get-Content $stdout -ErrorAction SilentlyContinue
              Write-Host '--- direct runtime stderr ---'
              Get-Content $stderr -ErrorAction SilentlyContinue
            }

            throw 'Gen2 local API did not become healthy behind the stable bootstrap service'
          }

          $runtime = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like '*\Licensing Agent\runtime\bke-licensing-agent-runtime.exe' }
          if (!$runtime) { throw 'bootstrap did not supervise the replaceable .NET runtime process' }
          Write-Host 'Python -> .NET runtime bridge local API: PASS'

      - name: Prove service restart durability
        shell: pwsh
        run: |
          Stop-Service -Name $env:SERVICE_NAME -Force
          (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
          Start-Service -Name $env:SERVICE_NAME
          (Get-Service -Name $env:SERVICE_NAME).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))

          $uri = 'http://127.0.0.1:43873/license-center?product_id=runtime-bridge-cert&version=2.0.0&installation_id=github-actions'
          $deadline = (Get-Date).AddSeconds(60)
          do {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $uri -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host 'Stable service restart -> Gen2 local API: PASS'
                exit 0
              }
            } catch {}
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          throw 'Gen2 local API did not recover after stable service restart'

      - name: Build deliberately broken Gen2 runtime candidate
        shell: pwsh
        run: |
          $runtime = 'dist/windows/bke-licensing-agent-runtime/bke-licensing-agent-runtime.exe'
          if (!(Test-Path $runtime)) { throw 'runtime executable missing before broken-candidate construction' }
          Set-Content -LiteralPath $runtime -Value 'deliberately-broken-runtime-bridge-candidate' -Encoding ascii

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent-runtime-bridge.iss
          $installer = "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe"
          if (!(Test-Path $installer)) { throw 'broken runtime bridge installer missing' }
          Write-Host 'Deliberately broken Gen2 runtime candidate built for rollback certification only.'

      - name: Prove automatic rollback to last-known-good runtime
        shell: pwsh
        run: |
          $installRoot = 'C:\Program Files\BKE Digital Solutions\Licensing Agent'
          $serviceExe = Join-Path $installRoot 'service\bke-licensing-agent-service.exe'
          $runtimeExe = Join-Path $installRoot 'runtime\bke-licensing-agent-runtime.exe'
          $serviceHashBefore = (Get-FileHash -Algorithm SHA256 $serviceExe).Hash
          $runtimeHashBefore = (Get-FileHash -Algorithm SHA256 $runtimeExe).Hash
          $snapshot = Join-Path $env:RUNNER_TEMP 'runtime-bridge-authority-state.json'
          $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'

          $installer = (Resolve-Path "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'broken-runtime-rollback.log'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "broken-candidate installer did not complete rollback cleanly: $($process.ExitCode)"
          }

          if (!(Select-String -LiteralPath $log -SimpleMatch 'Replacement runtime failed health; previous Agent payload restored automatically.')) {
            Get-Content $log
            throw 'installer did not record automatic runtime rollback'
          }

          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction Stop
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          if ((Get-FileHash -Algorithm SHA256 $serviceExe).Hash -ne $serviceHashBefore) {
            throw 'stable bootstrap payload was not restored exactly after broken candidate'
          }
          if ((Get-FileHash -Algorithm SHA256 $runtimeExe).Hash -ne $runtimeHashBefore) {
            throw 'last-known-good runtime payload was not restored exactly after broken candidate'
          }

          python dotnet/certification/runtime_bridge_state_fixture.py assert --data-root "$dataRoot" --snapshot "$snapshot"

          $uri = 'http://127.0.0.1:43873/v1/authorize'
          $body = @{
            product_id = 'runtime-bridge-cert'
            version = '2.0.0'
            installation_id = 'runtime-bridge-installation'
          } | ConvertTo-Json -Compress
          $deadline = (Get-Date).AddSeconds(60)
          do {
            try {
              $response = Invoke-RestMethod -Method Post -Uri $uri -ContentType 'application/json' -Body $body -TimeoutSec 2
              if ($response.authorized -eq $true -and $response.reason -eq 'authorized') {
                $runtime = Get-CimInstance Win32_Process |
                  Where-Object { $_.ExecutablePath -like '*\Licensing Agent\runtime\bke-licensing-agent-runtime.exe' }
                if (!$runtime) { throw 'restored bootstrap is not supervising the last-known-good runtime' }
                Write-Host 'Broken Gen2 candidate -> automatic last-known-good rollback: PASS'
                exit 0
              }
            } catch {}
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          throw 'last-known-good Gen2 runtime did not recover authorization after automatic rollback'

      - name: Publish exact Air Stack and Render Dock clients
        shell: pwsh
        run: |
          $airSha = (git -C products/air-stack rev-parse HEAD).Trim()
          $renderSha = (git -C products/render-dock rev-parse HEAD).Trim()
          if ($airSha -ne $env:AIR_STACK_SHA) { throw "Air Stack SHA drift: $airSha" }
          if ($renderSha -ne $env:RENDER_DOCK_SHA) { throw "Render Dock SHA drift: $renderSha" }

          $airPublish = Join-Path $env:RUNNER_TEMP 'runtime-bridge-air-stack'
          $renderPublish = Join-Path $env:RUNNER_TEMP 'runtime-bridge-render-dock'
          Remove-Item $airPublish,$renderPublish -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish "products/air-stack/BKE AirStack/BKE AirStack.csproj" -c Release -r win-x64 --self-contained true -p:SignManifests=false -o "$airPublish"
          if ($LASTEXITCODE -ne 0) { throw 'Air Stack publish failed' }

          Push-Location products/render-dock
          try {
            ./scripts/bootstrap-bke-sdk.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Render Dock BKE SDK bootstrap failed' }
            ./packaging/windows/publish.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Render Dock publish failed' }
          }
          finally {
            Pop-Location
          }
          Copy-Item "products/render-dock/artifacts/publish/win-x64" $renderPublish -Recurse

          if (!(Test-Path (Join-Path $airPublish 'BKE AirStack.dll'))) { throw 'Air Stack product assembly missing' }
          if (!(Test-Path (Join-Path $airPublish 'bke.manifest.json'))) { throw 'Air Stack manifest missing from publish' }
          if (!(Test-Path (Join-Path $renderPublish 'RENDER DOCK.dll'))) { throw 'Render Dock product assembly missing' }
          if (!(Test-Path (Join-Path $renderPublish 'bke.manifest.json'))) { throw 'Render Dock manifest missing from publish' }

          "AIR_PRODUCT_ROOT=$airPublish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RENDER_PRODUCT_ROOT=$renderPublish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Seed signed authority for exact real products
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:ProgramData 'BKE Digital Solutions\Licensing Agent'
          python dotnet/certification/real_product_runtime_bridge_fixture.py --data-root "$dataRoot" --air-root "$env:AIR_PRODUCT_ROOT" --render-root "$env:RENDER_PRODUCT_ROOT"

          $airId = Join-Path $env:LOCALAPPDATA 'BKE Digital Solutions\AIRSTACK\installation.id'
          $renderId = Join-Path $env:LOCALAPPDATA 'BKE Digital Solutions\RENDERDOCK\installation.id'
          New-Item -ItemType Directory -Force (Split-Path $airId) | Out-Null
          New-Item -ItemType Directory -Force (Split-Path $renderId) | Out-Null
          Set-Content -LiteralPath $airId -Value '11111111-1111-4111-8111-111111111111' -Encoding ascii
          Set-Content -LiteralPath $renderId -Value '22222222-2222-4222-8222-222222222222' -Encoding ascii

      - name: Build real product AgentClient reflection harness
        shell: pwsh
        run: |
          $harness = Join-Path $env:RUNNER_TEMP 'runtime-bridge-product-harness'
          dotnet publish dotnet/certification/BKE.LicensingAgent.RealProductClientHarness/BKE.LicensingAgent.RealProductClientHarness.csproj -c Release --self-contained false -o "$harness"
          if ($LASTEXITCODE -ne 0) { throw 'real product client harness publish failed' }
          Copy-Item (Join-Path $harness '*') $env:AIR_PRODUCT_ROOT -Force
          Copy-Item (Join-Path $harness '*') $env:RENDER_PRODUCT_ROOT -Force

      - name: Prove exact Air Stack client authorizes through installed Gen2
        shell: pwsh
        run: |
