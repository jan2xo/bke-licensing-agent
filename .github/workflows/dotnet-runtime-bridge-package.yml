name: .NET Agent runtime bridge certification package

on:
  workflow_dispatch:
  push:
    branches:
      - feat/agent-runtime-bridge
    paths:
      - ".github/workflows/dotnet-runtime-bridge-package.yml"
      - "dotnet/**"
      - "packaging/windows/bke-licensing-agent-runtime-bridge.iss"
      - "certification/windows_runtime_bridge_reboot.ps1"

permissions:
  contents: read

jobs:
  package:
    name: Windows certification package
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      BRIDGE_VERSION: "2.0.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[test]"
          choco install innosetup -y --no-progress

      - name: Build native support payloads
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist/windows | Out-Null

          pyinstaller --clean --noconfirm bke-license-center.spec
          Move-Item dist/bke-license-center dist/windows/bke-license-center

          pyinstaller --clean --noconfirm --onefile --name bke-updater-core packaging/windows/updater_core_entry.py
          New-Item -ItemType Directory -Force dist/windows/bke-updater-core | Out-Null
          Move-Item dist/bke-updater-core.exe dist/windows/bke-updater-core/bke-updater-core.exe

          pyinstaller --clean --noconfirm --onefile --name bke-privileged-provisioner packaging/windows/provision_privileged_runtime.py
          New-Item -ItemType Directory -Force dist/windows/bke-privileged-provisioner | Out-Null
          Move-Item dist/bke-privileged-provisioner.exe dist/windows/bke-privileged-provisioner/bke-privileged-provisioner.exe

      - name: Generate disposable certification trust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/privileged-payload/target-keys | Out-Null
          New-Item -ItemType Directory -Force dist/windows/privileged-payload/target-policies | Out-Null
          @'
          import base64, json
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          root = Path('dist/windows/privileged-payload')
          private = Ed25519PrivateKey.generate()
          public = private.public_key()
          key_id = 'runtime-bridge-cert-v1'
          (root / 'target-keys' / f'{key_id}.pem').write_bytes(public.public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          unsigned = {
              'schema': 'bke.install-target-policy.v1',
              'policy_id': 'runtime-bridge-cert-only',
              'revision': 1,
              'product_id': 'bke-certification-product',
              'platform': 'windows',
              'architecture': 'x86_64',
              'install_root': r'C:\\Program Files\\BKE Digital Solutions\\Certification Product',
              'entry_point': 'product.exe',
              'signing_key_id': key_id,
              'algorithm': 'Ed25519',
          }
          canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          document = dict(unsigned)
          document['signature'] = base64.b64encode(private.sign(canonical)).decode('ascii')
          (root / 'target-policies' / 'runtime-bridge-cert-only.json').write_text(
              json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          '@ | python -

      - name: Publish stable bootstrap and Gen2 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/bke-licensing-agent-service | Out-Null
          New-Item -ItemType Directory -Force dist/windows/bke-licensing-agent-runtime | Out-Null

          dotnet publish dotnet/src/BKE.LicensingAgent.Bootstrap/BKE.LicensingAgent.Bootstrap.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${env:BRIDGE_VERSION} --output dist/windows/bke-licensing-agent-service
          if ($LASTEXITCODE -ne 0) { throw 'stable bootstrap publish failed' }

          dotnet publish dotnet/src/BKE.LicensingAgent.Host/BKE.LicensingAgent.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:BKEAgentRuntimeBridge=true -p:Version=${env:BRIDGE_VERSION} --output dist/windows/bke-licensing-agent-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Gen2 runtime publish failed' }

      - name: Build certification-only bridge installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent-runtime-bridge.iss
          $installer = "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe"
          if (!(Test-Path $installer)) { throw "bridge installer missing: $installer" }

      - name: Assemble UTM certification ZIP
        shell: pwsh
        run: |
          $package = 'dist/utm-certification-package'
          New-Item -ItemType Directory -Force $package | Out-Null

          Copy-Item "dist/installer/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe" $package
          Copy-Item "certification/windows_runtime_bridge_reboot.ps1" $package

          @"
          BKE Licensing Agent Gen2 Runtime Bridge
          CERTIFICATION ONLY - NOT A PRODUCTION RELEASE

          Source commit:
          ${{ github.sha }}

          Contents:
          - BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Windows-x64.exe
          - windows_runtime_bridge_reboot.ps1
          - SHA256SUMS.txt

          This package exists only to execute the Python -> .NET Gen2 migration
          and real Windows reboot certification on a disposable/persistent test VM.

          DO NOT use this installer for production cutover.
          "@ | Set-Content -LiteralPath (Join-Path $package 'CERTIFICATION-ONLY.txt') -Encoding utf8

          $files = Get-ChildItem -LiteralPath $package -File | Where-Object Name -ne 'SHA256SUMS.txt'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding ascii

          $zip = "dist/BKE-Licensing-Agent-${env:BRIDGE_VERSION}-RuntimeBridge-Certification-${{ github.sha }}.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Format-List

      - name: Upload UTM certification package
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-RuntimeBridge-Certification
          path: dist/BKE-Licensing-Agent-2.0.0-RuntimeBridge-Certification-*.zip
          if-no-files-found: error
          retention-days: 14
