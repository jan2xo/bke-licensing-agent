name: Windows discovery certification

on:
  push:
    branches:
      - cert/windows-discovery-e246562
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout exact Windows test source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        shell: pwsh
        run: python -m pip install pytest pyinstaller && python -m pip install -e .
      - name: Verify installed-product discovery and service lifecycle
        shell: pwsh
        run: python -m pytest tests/unit/test_discovery.py tests/unit/test_runtime.py tests/unit/test_runtime_shutdown.py tests/unit/test_storage.py tests/unit/test_windows_packaging.py tests/unit/test_windows_service_entry_source.py -q
      - name: Freeze Windows executables
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm bke-license-center.spec
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Move-Item dist/bke-license-center dist/windows/bke-license-center
          pyinstaller --clean --noconfirm --hidden-import win32timezone --name bke-licensing-agent-service packaging/windows/service_entry.py
          Move-Item dist/bke-licensing-agent-service dist/windows/bke-licensing-agent-service-wrapper
      - name: Smoke test frozen Agent service wrapper
        shell: pwsh
        run: dist/windows/bke-licensing-agent-service-wrapper/bke-licensing-agent-service.exe --smoke
      - name: Smoke test frozen service dependencies
        shell: pwsh
        run: dist/windows/bke-licensing-agent-service-wrapper/bke-licensing-agent-service.exe --service-smoke
      - name: Smoke test frozen SCM host
        shell: pwsh
        run: dist/windows/bke-licensing-agent-service-wrapper/bke-licensing-agent-service.exe --service-host-smoke
      - name: Smoke test frozen License Center
        shell: pwsh
        run: dist/windows/bke-license-center/bke-license-center.exe --smoke
      - name: Compile Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent.iss
      - name: Record Windows installer SHA-256
        shell: pwsh
        run: |
          $artifact = "dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe"
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BKE-Licensing-Agent-1.0.0-Windows-x64.exe" | Set-Content dist/installer/WINDOWS-TEST-SHA256.txt
          Get-Item $artifact
          Get-Content dist/installer/WINDOWS-TEST-SHA256.txt
      - name: Upload Windows native test candidate
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-1.0.0-Windows-discovery-test
          path: |
            dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe
            dist/installer/WINDOWS-TEST-SHA256.txt
