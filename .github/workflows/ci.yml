name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      BKE_TEST_SIGNING_KEY_ID: ci-ed25519-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check out pinned updater core
        uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-updater-core
          ref: 06ac55e406c3f54bf9bad74bc92ba11d3d38bafe
          path: .ci/bke-updater-core
          token: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./\.ci/bke-updater-core
          python -m pip install "typer>=0.10.0" "pydantic>=2.9,<3" "keyring>=24.0.0" "requests>=2.31,<3" "jsonschema>=4.0,<5" "cryptography>=50,<51" "pytest>=8.0" "types-jsonschema>=4.0"
          python -m pip install -e . --no-deps
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate package import and metadata
        run: python -c "import bke_licensing_agent, bke_updater_core; print(bke_licensing_agent.__name__, bke_updater_core.__name__)"
      - name: Build wheel
        run: python -m pip install build && python -m build --wheel
      - name: Check diff and repository hygiene
        run: git diff --check

  authority-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: bke, POSTGRES_PASSWORD: bke, POSTGRES_DB: bke_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://bke:bke@127.0.0.1:5432/bke_test
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
      LICENSE_PEPPER: ci-license-pepper-with-at-least-32-chars
      LICENSE_SIGNING_KEY_ID: ci-ed25519-v1
      PAYMENT_PROVIDER: mock
      EMAIL_FROM: test@example.com
      CRON_SECRET: ci-cron-secret-with-at-least-32-chars
      S3_BUCKET: test
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: bke
      S3_SECRET_ACCESS_KEY: bke-secret
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-digital-solutions
          ref: feat/universal-updater-integration
          path: digital-solutions
          token: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-updater-core
          ref: 06ac55e406c3f54bf9bad74bc92ba11d3d38bafe
          path: updater-core
          token: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache-dependency-path: digital-solutions/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Start disposable object storage
        run: |
          docker run -d --name bke-cert-minio -p 9000:9000 -p 9001:9001 -e MINIO_ROOT_USER=bke -e MINIO_ROOT_PASSWORD=bke-secret minio/minio:latest server /data
          docker run -d --name bke-cert-redis -p 6379:6379 redis:7-alpine
          for attempt in $(seq 1 30); do docker exec bke-cert-redis redis-cli ping >/dev/null 2>&1 && break; sleep 2; done
          docker exec bke-cert-redis redis-cli ping
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
      - name: Generate disposable signing key
        working-directory: digital-solutions
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/authority-private.pem 2>/dev/null
          openssl pkey -in /tmp/authority-private.pem -pubout -out /tmp/authority-public.pem 2>/dev/null
          chmod 600 /tmp/authority-private.pem /tmp/authority-public.pem
      - name: Prepare authority application
        working-directory: digital-solutions
        run: |
          npm ci
          npm run db:generate
          npm run db:deploy
          npm run db:seed
          npx tsx scripts/certify-update-authority.ts > /tmp/authority-seed.json
      - name: Start authority server
        working-directory: digital-solutions
        run: |
          npm run build
          export LICENSE_SIGNING_PRIVATE_KEY="$(cat /tmp/authority-private.pem)"
          export LICENSE_SIGNING_PUBLIC_KEY="$(cat /tmp/authority-public.pem)"
          npm start > /tmp/digital-solutions.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null
      - name: Execute real authority to Agent to core lifecycle
        working-directory: .
        run: |
          python -m pip install ./updater-core -q
          python -m pip install -e . --no-deps -q
          python -m pip install "requests>=2.31,<3" "cryptography>=50,<51" "pydantic>=2.9,<3" "jsonschema>=4.0,<5" "typer>=0.10.0" "keyring>=24.0.0" "packaging>=24,<26" -q
          PRODUCT_ID=$(python -c 'import json; print(json.load(open("/tmp/authority-seed.json"))["productId"])')
          curl -fsS -X POST http://127.0.0.1:3000/api/agent/updates/check -H 'content-type: application/json' --data "{\"license_key\":\"BKE-CERTIFICATION-UPDATE-2026\",\"product_id\":\"$PRODUCT_ID\",\"current_version\":\"1.0.0\",\"platform\":\"linux\",\"architecture\":\"x86_64\",\"channel\":\"stable\"}" > /tmp/update-response.json
          python - <<'PY'
          import json, pathlib, requests
          r=json.loads(pathlib.Path("/tmp/update-response.json").read_text())
          assert r["policy"]["schema"]=="bke.update-policy.v1"
          a=requests.get(r["download_url"],timeout=10); a.raise_for_status()
          pathlib.Path("/tmp/authority-artifact").write_bytes(a.content)
          assert len(a.content)==r["policy"]["artifact_size"]
          print({"grant_http_status":a.status_code,"artifact_size":len(a.content),"schema":r["policy"]["schema"]})
          PY
          python - <<'PY'
          import json, pathlib, subprocess
          from cryptography.hazmat.primitives import serialization
          from bke_updater_core import PolicyVerifier
          from bke_updater_core.models import ProductManifest, TransactionState
          from bke_licensing_agent.updates.orchestrator import UpdateOrchestrator
          r=json.loads(pathlib.Path("/tmp/update-response.json").read_text()); p=r["policy"]
          key=serialization.load_pem_public_key(pathlib.Path("/tmp/authority-public.pem").read_bytes()).public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          verified=PolicyVerifier({"ci-ed25519-v1":key}).verify(p,product_id=p["product_id"],platform="linux",architecture="x86_64",channel="stable")
          root=pathlib.Path("/tmp/authority-install"); root.mkdir(); old=root/"product.sh"; old.write_text("#!/usr/bin/env sh\necho authority-product-v1\n"); old.chmod(0o755)
          result=UpdateOrchestrator({"ci-ed25519-v1":key},pathlib.Path("/tmp/authority-state")).execute_update(ProductManifest(p["product_id"],"1.0.0","linux","x86_64","product.sh",root),verified,pathlib.Path("/tmp/authority-artifact"),pathlib.Path("/tmp/authority-backup"))
          assert result is TransactionState.COMMITTED
          assert subprocess.run([str(root/"product.sh")],capture_output=True,text=True).stdout.strip()=="authority-product-v2"
          print({"policy_verified":True,"transaction":result.value,"product":"authority-product-v2"})
          PY

# Authority fixture follows the persisted commercial plan constraints.

# Authority follows the Digital Solutions signing-registry bootstrap contract.

# Authority signature canonicalization is code-point ordered across repositories.
