name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      BKE_TEST_SIGNING_KEY_ID: ci-ed25519-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Diagnose updater core read credential
        env:
          READ_TOKEN: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${READ_TOKEN:-}" ]; then
            echo "BKE_UPDATER_CORE_READ_TOKEN_PRESENT=false"
            echo "Required sibling-repository credential is unavailable; refusing checkout." >&2
            exit 1
          fi
          echo "BKE_UPDATER_CORE_READ_TOKEN_PRESENT=true"

          user_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${READ_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/user)"
          repo_status="$(curl --silent --show-error --output /tmp/bke-updater-core.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${READ_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jan2xo/bke-updater-core)"

          echo "GITHUB_AUTH_HTTP_STATUS=${user_status}"
          echo "BKE_UPDATER_CORE_HTTP_STATUS=${repo_status}"
          if [ "${repo_status}" = "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/bke-updater-core.json").read_text())
          print("BKE_UPDATER_CORE_METADATA=" + json.dumps({
              "full_name": data.get("full_name"),
              "private": data.get("private"),
              "default_branch": data.get("default_branch"),
              "archived": data.get("archived"),
          }, sort_keys=True))
          PY
          fi
      - name: Check out pinned updater core branch
        uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-updater-core
          ref: feat/universal-updater-core
          path: .ci/bke-updater-core
          token: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./\.ci/bke-updater-core
          python -m pip install "typer>=0.10.0" "pydantic>=2.9,<3" "keyring>=24.0.0" "requests>=2.31,<3" "jsonschema>=4.0,<5" "cryptography>=50,<51" "pytest>=8.0" "types-jsonschema>=4.0"
          python -m pip install -e . --no-deps
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate package import and metadata
        run: python -c "import bke_licensing_agent, bke_updater_core; print(bke_licensing_agent.__name__, bke_updater_core.__name__)"
      - name: Build wheel
        run: python -m pip install build && python -m build --wheel
      - name: Check diff and repository hygiene
        run: git diff --check
