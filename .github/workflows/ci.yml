name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      BKE_TEST_SIGNING_KEY_ID: ci-ed25519-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify sibling repository read boundary
        env:
          SIBLING_READ_TOKEN: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_READ_TOKEN:-}" ]; then
            echo "SIBLING_REPOS_READ_TOKEN_PRESENT=false"
            exit 1
          fi
          echo "SIBLING_REPOS_READ_TOKEN_PRESENT=true"
          for repository in jan2xo/bke-updater-core jan2xo/bke-digital-solutions; do
            status="$(curl --silent --show-error --output /tmp/repository.json --write-out "%{http_code}" \
              --header "Authorization: Bearer ${SIBLING_READ_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repository}")"
            echo "${repository}_HTTP_STATUS=${status}"
            if [ "${status}" != "200" ]; then exit 1; fi
          done
      - name: Check out pinned updater core branch
        uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-updater-core
          ref: feat/universal-updater-core
          path: .ci/bke-updater-core
          token: ${{ secrets.BKE_UPDATER_CORE_READ_TOKEN }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./\.ci/bke-updater-core
          python -m pip install "typer>=0.10.0" "pydantic>=2.9,<3" "keyring>=24.0.0" "requests>=2.31,<3" "jsonschema>=4.0,<5" "cryptography>=50,<51" "pytest>=8.0" "types-jsonschema>=4.0"
          python -m pip install -e . --no-deps
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate package import and metadata
        run: python -c "import bke_licensing_agent, bke_updater_core; print(bke_licensing_agent.__name__, bke_updater_core.__name__)"
      - name: Build wheel
        run: python -m pip install build && python -m build --wheel
      - name: Check diff and repository hygiene
        run: git diff --check
