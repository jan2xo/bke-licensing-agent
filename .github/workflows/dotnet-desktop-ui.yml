name: .NET 10 Agent Desktop UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-ui:
    name: Presentation contract + Avalonia shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Certify desktop UI boundary
        run: bash dotnet/certify-ui.sh
