name: Render Dock release-to-release in-place update certification

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/render-dock-release-to-release-update.yml'
      - 'src/bke_licensing_agent/updates/**'
      - 'packaging/windows/updater_core_entry.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-dock-release-to-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RENDER_DOCK_OLD_SHA: 17f55552908e54a54dd2cdfb5e00df5ba8da567c
      RENDER_DOCK_NEW_SHA: 98653d9a9e8967caf74156ee77f5e5c6126aaee7
      UPDATER_CORE_SHA: 25cae19e98c49ccbac01f5d45192edfd8686d1e6
    steps:
      - name: Checkout exact Agent candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: agent

      - name: Checkout Render Dock 1.0.1
        uses: actions/checkout@v4
        with:
          repository: jan2xo/BKE_RENDER_DOCK
          ref: ${{ env.RENDER_DOCK_OLD_SHA }}
          path: render-dock-101

      - name: Checkout Render Dock 1.0.2
        uses: actions/checkout@v4
        with:
          repository: jan2xo/BKE_RENDER_DOCK
          ref: ${{ env.RENDER_DOCK_NEW_SHA }}
          path: render-dock-102

      - name: Checkout pinned Updater Core
        uses: actions/checkout@v4
        with:
          repository: jan2xo/bke-updater-core
          ref: ${{ env.UPDATER_CORE_SHA }}
          path: updater-core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install exact updater stack
        shell: pwsh
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[test]"

      - name: Prove exact product revisions and canonical versions
        shell: pwsh
        run: |
          if ((git -C render-dock-101 rev-parse HEAD).Trim() -ne $env:RENDER_DOCK_OLD_SHA) { throw 'Render Dock 1.0.1 SHA drift' }
          if ((git -C render-dock-102 rev-parse HEAD).Trim() -ne $env:RENDER_DOCK_NEW_SHA) { throw 'Render Dock 1.0.2 SHA drift' }
          if ((git -C updater-core rev-parse HEAD).Trim() -ne $env:UPDATER_CORE_SHA) { throw 'Updater Core SHA drift' }
          $oldManifest = Get-Content 'render-dock-101/BKE_RENDER_DOCK/bke.manifest.json' -Raw | ConvertFrom-Json
          $newManifest = Get-Content 'render-dock-102/BKE_RENDER_DOCK/bke.manifest.json' -Raw | ConvertFrom-Json
          if ($oldManifest.productId -ne 'bke-render-dock' -or $oldManifest.version -ne '1.0.1') { throw 'old Render Dock manifest mismatch' }
          if ($newManifest.productId -ne 'bke-render-dock' -or $newManifest.version -ne '1.0.2') { throw 'new Render Dock manifest mismatch' }

      - name: Publish exact Render Dock 1.0.1 and 1.0.2 trees
        shell: pwsh
        run: |
          & 'render-dock-101/packaging/windows/publish.ps1'
          & 'render-dock-102/packaging/windows/publish.ps1'
          if (!(Test-Path 'render-dock-101/artifacts/publish/win-x64/RENDER DOCK.exe')) { throw 'Render Dock 1.0.1 publish missing' }
          if (!(Test-Path 'render-dock-102/artifacts/publish/win-x64/RENDER DOCK.exe')) { throw 'Render Dock 1.0.2 publish missing' }

      - name: Freeze exact pinned privileged helper
        shell: pwsh
        working-directory: agent
        run: |
          pyinstaller --clean --noconfirm --onefile --name bke-updater-core packaging/windows/updater_core_entry.py
          if (!(Test-Path 'dist/bke-updater-core.exe')) { throw 'frozen privileged helper missing' }

      - name: Execute real Render Dock release-to-release update and rollback proof
        shell: pwsh
        env:
          PYTHONPATH: agent/src
        run: |
          @'
          import base64
          import hashlib
          import json
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from bke_updater_core.models import ProductManifest
          from bke_licensing_agent.updates.orchestrator import UPDATE_PACKAGE_CONTENT_TYPE, UpdateOrchestrator
          from bke_licensing_agent.updates.privileged_runtime import AgentPrivilegedRuntimeConfig

          workspace = Path.cwd()
          old_publish = workspace / 'render-dock-101' / 'artifacts' / 'publish' / 'win-x64'
          new_publish = workspace / 'render-dock-102' / 'artifacts' / 'publish' / 'win-x64'
          helper = workspace / 'agent' / 'dist' / 'bke-updater-core.exe'
          evidence = workspace / 'evidence' / 'render-dock-release-to-release'
          evidence.mkdir(parents=True, exist_ok=True)

          install_parent = Path.home() / 'bke-certification-installs'
          install_root = install_parent / 'Render Dock'
          outside = install_parent / 'customer-owned.txt'
          runtime_root = Path.home() / 'bke-certification-runtime' / 'render-dock'
          for path in (install_root, runtime_root):
              if path.exists():
                  shutil.rmtree(path)
          install_parent.mkdir(parents=True, exist_ok=True)
          outside.write_text('must-survive', encoding='utf-8')
          shutil.copytree(old_publish, install_root)
          old_manifest = json.loads((install_root / 'bke.manifest.json').read_text(encoding='utf-8-sig'))
          assert old_manifest['version'] == '1.0.1'

          update_key = Ed25519PrivateKey.generate()
          target_key = Ed25519PrivateKey.generate()
          agent_key = Ed25519PrivateKey.generate()
          raw_update_public = update_key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          raw_target_public = target_key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          raw_agent_private = agent_key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())

          def canonical(document):
              return json.dumps(document, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()

          def sign_update(artifact, current, latest, revision, release_id):
              unsigned = {
                  'schema': 'bke.update-policy.v1',
                  'product_id': 'bke-render-dock',
                  'current_version': current,
                  'latest_version': latest,
                  'minimum_supported_version': '1.0.1',
                  'channel': 'stable',
                  'platform': 'windows',
                  'architecture': 'x64',
                  'release_id': release_id,
                  'artifact_id': f'{release_id}-windows-x64',
                  'artifact_sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
                  'artifact_size': artifact.stat().st_size,
                  'content_type': UPDATE_PACKAGE_CONTENT_TYPE,
                  'published_at': '2026-09-16T00:00:00Z',
                  'issued_at': '2026-09-16T00:00:00Z',
                  'revision': revision,
                  'signing_key_id': 'cert-digital-v1',
                  'algorithm': 'Ed25519',
              }
              return {**unsigned, 'signature': base64.b64encode(update_key.sign(canonical(unsigned))).decode('ascii')}

          target_unsigned = {
              'schema': 'bke.install-target-policy.v1',
              'policy_id': 'cert-render-dock-windows-x64-v1',
              'revision': 1,
              'product_id': 'bke-render-dock',
              'platform': 'windows',
              'architecture': 'x64',
              'install_root': str(install_root),
              'entry_point': 'RENDER DOCK.exe',
              'signing_key_id': 'cert-bke-target-v1',
              'algorithm': 'Ed25519',
          }
          target_policy = {**target_unsigned, 'signature': base64.b64encode(target_key.sign(canonical(target_unsigned))).decode('ascii')}

          config = AgentPrivilegedRuntimeConfig(
              runtime_root=runtime_root,
              helper_executable=helper,
              signing_key_id='cert-agent-local-v1',
              signing_private_key=raw_agent_private,
              trusted_digital_keys={'cert-digital-v1': raw_update_public},
              trusted_bke_keys={'cert-bke-target-v1': raw_target_public},
              approved_install_roots=(str(install_parent),),
              expected_channel='stable',
          )

          def make_zip(source, destination):
              destination.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(destination, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
                  for item in sorted(source.rglob('*')):
                      if item.is_file():
                          archive.write(item, item.relative_to(source).as_posix())

          update_zip = workspace / 'render-dock-1.0.2.update.zip'
          make_zip(new_publish, update_zip)
          orchestrator = UpdateOrchestrator({'cert-digital-v1': raw_update_public}, workspace / 'agent-state' / 'render-dock')
          manifest_101 = ProductManifest('bke-render-dock', '1.0.1', 'windows', 'x64', 'RENDER DOCK.exe', install_root, update_channel='stable')
          policy_102 = orchestrator.verify_policy(sign_update(update_zip, '1.0.1', '1.0.2', 1, 'render-dock-1.0.2'), manifest_101)
          result = orchestrator.execute_privileged_update(
              manifest_101,
              policy_102,
              update_zip,
              privileged_config=config,
              target_policy=target_policy,
              elevate=lambda command: subprocess.run(list(command), check=True),
          )
          assert result.value == 'STAGED'
          installed_102 = json.loads((install_root / 'bke.manifest.json').read_text(encoding='utf-8-sig'))
          assert installed_102['version'] == '1.0.2'
          assert outside.read_text(encoding='utf-8') == 'must-survive'

          subprocess.run(['taskkill', '/F', '/IM', 'RENDER DOCK.exe'], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          broken_root = workspace / 'broken-render-dock-1.0.3'
          if broken_root.exists():
              shutil.rmtree(broken_root)
          shutil.copytree(new_publish, broken_root)
          (broken_root / 'RENDER DOCK.exe').write_text('not-a-windows-executable', encoding='utf-8')
          broken_manifest = json.loads((broken_root / 'bke.manifest.json').read_text(encoding='utf-8-sig'))
          broken_manifest['version'] = '1.0.3'
          (broken_root / 'bke.manifest.json').write_text(json.dumps(broken_manifest, indent=2), encoding='utf-8')
          broken_zip = workspace / 'render-dock-1.0.3-broken.update.zip'
          make_zip(broken_root, broken_zip)

          manifest_102 = ProductManifest('bke-render-dock', '1.0.2', 'windows', 'x64', 'RENDER DOCK.exe', install_root, update_channel='stable')
          policy_103 = orchestrator.verify_policy(sign_update(broken_zip, '1.0.2', '1.0.3', 2, 'render-dock-1.0.3-broken'), manifest_102)
          rollback_observed = False
          try:
              orchestrator.execute_privileged_update(
                  manifest_102,
                  policy_103,
                  broken_zip,
                  privileged_config=config,
                  target_policy=target_policy,
                  elevate=lambda command: subprocess.run(list(command), check=True),
              )
          except subprocess.CalledProcessError:
              rollback_observed = True
          assert rollback_observed, 'broken 1.0.3 update unexpectedly succeeded'
          restored = json.loads((install_root / 'bke.manifest.json').read_text(encoding='utf-8-sig'))
          assert restored['version'] == '1.0.2', restored
          assert outside.read_text(encoding='utf-8') == 'must-survive'

          transactions = runtime_root / 'transactions'
          transaction_docs = []
          for state in sorted(transactions.glob('*/state.json')):
              doc = json.loads(state.read_text(encoding='utf-8'))
              transaction_docs.append(doc)
          states = {doc['state'] for doc in transaction_docs}
          assert 'COMMITTED' in states, states
          assert 'ROLLED_BACK' in states, states

          summary = {
              'old_source_sha': '${{ env.RENDER_DOCK_OLD_SHA }}',
              'new_source_sha': '${{ env.RENDER_DOCK_NEW_SHA }}',
              'updater_core_sha': '${{ env.UPDATER_CORE_SHA }}',
              'installed_before': '1.0.1',
              'installed_after': '1.0.2',
              'broken_target': '1.0.3',
              'rollback_restored': '1.0.2',
              'outside_data_preserved': True,
              'helper_states': sorted(states),
              'update_zip_sha256': hashlib.sha256(update_zip.read_bytes()).hexdigest(),
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          (evidence / 'transactions.json').write_text(json.dumps(transaction_docs, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          '@ | python -

      - name: Upload Render Dock release-to-release evidence
        uses: actions/upload-artifact@v4
        with:
          name: render-dock-1.0.1-to-1.0.2-in-place-evidence
          path: evidence/render-dock-release-to-release
          if-no-files-found: error
