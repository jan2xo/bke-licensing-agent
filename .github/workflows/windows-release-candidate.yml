name: Windows release candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: "1.0.0"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[test]"

      - name: Verify canonical package version
        shell: pwsh
        run: |
          python -c "import importlib.metadata as m; assert m.version('bke-licensing-agent') == '${env:RELEASE_VERSION}'; print(m.version('bke-licensing-agent'))"

      - name: Run Windows native tests
        shell: pwsh
        run: python -m pytest -q tests/windows tests/unit/test_module_launch.py tests/unit/test_native_privileged_provisioning.py tests/unit/test_windows_privileged_packaging.py

      - name: Freeze Windows service and License Center
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          pyinstaller --clean --noconfirm --hidden-import win32timezone --name bke-licensing-agent-service packaging/windows/service_entry.py
          Move-Item dist/bke-licensing-agent-service dist/windows/bke-licensing-agent-service
          pyinstaller --clean --noconfirm bke-license-center.spec
          Move-Item dist/bke-license-center dist/windows/bke-license-center

      - name: Freeze certified Updater Core and privileged provisioner
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name bke-updater-core packaging/windows/updater_core_entry.py
          New-Item -ItemType Directory -Force dist/windows/bke-updater-core | Out-Null
          Move-Item dist/bke-updater-core.exe dist/windows/bke-updater-core/bke-updater-core.exe
          pyinstaller --clean --noconfirm --onefile --name bke-privileged-provisioner packaging/windows/provision_privileged_runtime.py
          New-Item -ItemType Directory -Force dist/windows/bke-privileged-provisioner | Out-Null
          Move-Item dist/bke-privileged-provisioner.exe dist/windows/bke-privileged-provisioner/bke-privileged-provisioner.exe

      - name: Smoke frozen runtime entry points
        shell: pwsh
        run: |
          dist/windows/bke-licensing-agent-service/bke-licensing-agent-service.exe --smoke
          dist/windows/bke-licensing-agent-service/bke-licensing-agent-service.exe --service-smoke
          dist/windows/bke-licensing-agent-service/bke-licensing-agent-service.exe --service-host-smoke
          dist/windows/bke-license-center/bke-license-center.exe --smoke
          dist/windows/bke-updater-core/bke-updater-core.exe --help

      - name: Generate disposable packaging-only target trust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/privileged-payload/target-keys | Out-Null
          New-Item -ItemType Directory -Force dist/windows/privileged-payload/target-policies | Out-Null
          @'
          import base64, json
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          root = Path('dist/windows/privileged-payload')
          private = Ed25519PrivateKey.generate()
          public = private.public_key()
          key_id = 'ci-packaging-target-v1'
          (root / 'target-keys' / f'{key_id}.pem').write_bytes(public.public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          unsigned = {
              'schema': 'bke.install-target-policy.v1',
              'policy_id': 'ci-packaging-only',
              'revision': 1,
              'product_id': 'bke-certification-product',
              'platform': 'windows',
              'architecture': 'x86_64',
              'install_root': r'C:\Program Files\BKE Digital Solutions\Certification Product',
              'entry_point': 'product.exe',
              'signing_key_id': key_id,
              'algorithm': 'Ed25519',
          }
          canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          document = dict(unsigned)
          document['signature'] = base64.b64encode(private.sign(canonical)).decode('ascii')
          (root / 'target-policies' / 'ci-packaging-only.json').write_text(
              json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('Disposable target trust generated for package certification only; not production authority.')
          '@ | python -

      - name: Build hardened Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/bke-licensing-agent.iss

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = "dist/installer/BKE-Licensing-Agent-${env:RELEASE_VERSION}-Windows-x64.exe"
          if (!(Test-Path $installer)) { throw "installer artifact missing" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "${hash}  BKE-Licensing-Agent-${env:RELEASE_VERSION}-Windows-x64.exe" | Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt
          "source=${env:SOURCE_SHA}" | Set-Content -Encoding ascii dist/installer/SOURCE.txt
          Get-Item $installer | Select-Object Name,Length
          Get-Content dist/installer/SHA256SUMS.txt

      - name: Attest release-candidate provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BKE-Licensing-Agent-1.0.0-Windows-x64-RC
          path: |
            dist/installer/BKE-Licensing-Agent-1.0.0-Windows-x64.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/SOURCE.txt

      - name: Release boundary reminder
        shell: pwsh
        run: |
          Write-Host "This CI artifact proves build/package integrity with disposable target trust."
          Write-Host "A public production release MUST replace the disposable payload with persistent BKE-signed target keys/policies and pass installed Windows acceptance."
